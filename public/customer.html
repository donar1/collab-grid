<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>客户门户 · CollabGrid</title>
  <style>
    :root { --primary:#2563eb; --bg:#f8fafc; --card:#fff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    .container { max-width:1200px; margin:0 auto; padding:24px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    header h1 { font-size:20px; font-weight:600; }
    .login-bar { display:flex; gap:8px; align-items:center; background:var(--card); padding:12px 16px; border-radius:8px; border:1px solid var(--border); margin-bottom:20px; }
    .login-bar input { flex:1; padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
    .login-bar button { padding:8px 16px; background:var(--primary); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
    .login-bar button:hover { opacity:.9; }
    .tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--border); }
    .tab { padding:10px 20px; cursor:pointer; border-bottom:2px solid transparent; color:var(--muted); font-size:14px; }
    .tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:500; }
    .panel { display:none; }
    .panel.active { display:block; }
    .filters { display:flex; flex-wrap:wrap; gap:10px; background:var(--card); padding:16px; border-radius:8px; border:1px solid var(--border); margin-bottom:16px; }
    .filters input, .filters select { padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; min-width:140px; }
    .filters button { padding:8px 16px; background:var(--primary); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
    .stat-card { background:var(--card); padding:16px; border-radius:8px; border:1px solid var(--border); }
    .stat-card .label { font-size:12px; color:var(--muted); margin-bottom:4px; }
    .stat-card .value { font-size:20px; font-weight:600; color:var(--primary); }
    table { width:100%; background:var(--card); border-radius:8px; border:1px solid var(--border); border-collapse:collapse; font-size:13px; }
    th, td { padding:12px 16px; text-align:left; border-bottom:1px solid var(--border); }
    th { background:#f1f5f9; font-weight:500; font-size:12px; color:var(--muted); text-transform:uppercase; }
    tr:hover { background:#f8fafc; }
    .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:500; }
    .badge-success { background:#dcfce7; color:#166534; }
    .badge-warn { background:#fef3c7; color:#92400e; }
    .badge-info { background:#dbeafe; color:#1e40af; }
    .pagination { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:16px; }
    .pagination button { padding:6px 14px; border:1px solid var(--border); background:var(--card); border-radius:6px; cursor:pointer; font-size:13px; }
    .pagination button:disabled { opacity:.5; cursor:not-allowed; }
    .pagination span { font-size:13px; color:var(--muted); }
    .empty { text-align:center; padding:60px 20px; color:var(--muted); }
    .empty svg { width:64px; height:64px; margin-bottom:16px; opacity:.3; }
    .error { background:#fef2f2; color:#991b1b; padding:12px 16px; border-radius:6px; margin-bottom:16px; font-size:13px; }
    .login-screen { display:flex; align-items:center; justify-content:center; min-height:60vh; }
    .login-card { background:var(--card); padding:40px; border-radius:12px; border:1px solid var(--border); width:100%; max-width:400px; }
    .login-card h2 { font-size:18px; margin-bottom:8px; }
    .login-card p { font-size:13px; color:var(--muted); margin-bottom:20px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; }
    .form-group input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
    .submit-btn { width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-size:15px; cursor:pointer; }
    .submit-btn:hover { opacity:.9; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>客户门户</h1>
      <div id="customerInfo" style="font-size:13px;color:var(--muted);"></div>
    </header>

    <!-- 登录界面 -->
    <div id="loginScreen" class="login-screen">
      <div class="login-card">
        <h2>客户登录</h2>
        <p>请输入您的客户令牌以访问订单和对账信息</p>
        <div class="form-group">
          <label for="tokenInput">客户令牌</label>
          <input type="text" id="tokenInput" placeholder="请输入客户查询令牌" />
        </div>
        <div id="loginError" class="error" style="display:none"></div>
        <button class="submit-btn" id="loginBtn">登录</button>
      </div>
    </div>

    <!-- 主界面（登录后显示） -->
    <div id="mainApp" style="display:none">
      <div class="login-bar">
        <span id="tokenDisplay" style="font-size:13px;color:var(--muted);"></span>
        <button id="logoutBtn" style="background:var(--muted)">退出登录</button>
      </div>

      <div id="errorBox"></div>

      <div class="tabs" id="tabs">
        <div class="tab active" data-tab="orders">订单列表</div>
        <div class="tab" data-tab="bills">账单列表</div>
        <div class="tab" data-tab="recon">对账汇总</div>
      </div>

      <!-- 订单面板 -->
      <div class="panel active" id="panel-orders">
        <div class="filters">
          <input type="date" id="orderDateFrom" />
          <input type="date" id="orderDateTo" />
          <select id="orderStatus">
            <option value="">全部状态</option>
            <option value="pending">待处理</option>
            <option value="confirmed">已确认</option>
            <option value="completed">已完成</option>
            <option value="cancelled">已取消</option>
          </select>
          <input type="text" id="orderKeyword" placeholder="关键词搜索" />
          <button id="orderFilterBtn">筛选</button>
          <button id="orderResetBtn" style="background:var(--muted)">重置</button>
        </div>
        <div class="stats" id="orderStats">
          <div class="stat-card"><div class="label">总订单数</div><div class="value" id="statOrderTotal">-</div></div>
          <div class="stat-card"><div class="label">总金额</div><div class="value" id="statOrderAmount">-</div></div>
          <div class="stat-card"><div class="label">已完成</div><div class="value" id="statOrderCompleted">-</div></div>
          <div class="stat-card"><div class="label">待处理</div><div class="value" id="statOrderPending">-</div></div>
        </div>
        <div id="ordersTableArea"></div>
        <div class="pagination" id="orderPagination">
          <button id="orderPrevBtn">上一页</button>
          <span id="orderPageInfo"></span>
          <button id="orderNextBtn">下一页</button>
        </div>
      </div>

      <!-- 账单面板 -->
      <div class="panel" id="panel-bills">
        <div class="filters">
          <input type="date" id="billDateFrom" />
          <input type="date" id="billDateTo" />
          <select id="billStatus">
            <option value="">全部状态</option>
            <option value="unpaid">未付款</option>
            <option value="paid">已付款</option>
            <option value="overdue">逾期</option>
          </select>
          <button id="billFilterBtn">筛选</button>
          <button id="billResetBtn" style="background:var(--muted)">重置</button>
        </div>
        <div class="stats" id="billStats">
          <div class="stat-card"><div class="label">总账单数</div><div class="value" id="statBillTotal">-</div></div>
          <div class="stat-card"><div class="label">应付总额</div><div class="value" id="statBillAmount">-</div></div>
          <div class="stat-card"><div class="label">已付总额</div><div class="value" id="statBillPaid">-</div></div>
          <div class="stat-card"><div class="label">未付总额</div><div class="value" id="statBillUnpaid">-</div></div>
        </div>
        <div id="billsTableArea"></div>
        <div class="pagination" id="billPagination">
          <button id="billPrevBtn">上一页</button>
          <span id="billPageInfo"></span>
          <button id="billNextBtn">下一页</button>
        </div>
      </div>

      <!-- 对账汇总面板 -->
      <div class="panel" id="panel-recon">
        <div class="filters">
          <input type="date" id="reconDateFrom" />
          <input type="date" id="reconDateTo" />
          <button id="reconFilterBtn">查询</button>
          <button id="reconResetBtn" style="background:var(--muted)">重置</button>
        </div>
        <div class="stats" id="reconStats">
          <div class="stat-card"><div class="label">借方合计</div><div class="value" id="rDebit">-</div></div>
          <div class="stat-card"><div class="label">贷方合计</div><div class="value" id="rCredit">-</div></div>
          <div class="stat-card"><div class="label">净额</div><div class="value" id="rNet">-</div></div>
        </div>
        <div id="reconTableArea"></div>
        <div class="pagination" id="reconPagination">
          <button id="reconPrevBtn">上一页</button>
          <span id="reconPageInfo"></span>
          <button id="reconNextBtn">下一页</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 使用全局模块引用（api.js 和 utils.js 均为 IIFE 模块，挂在 window 上）
    const { api: apiFetch } = window;
    const { toast: showToast } = window;

    // XSS 防护
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ---- 状态 ----
    let token = localStorage.getItem('cg_customer_token') || '';
    let customer = null;
    const limit = 20;

    // 订单分页状态
    let ordersOffset = 0;
    let ordersTotal = 0;
    let ordersData = [];

    // 账单分页状态
    let billsOffset = 0;
    let billsTotal = 0;
    let billsData = [];

    // 对账分页状态
    let reconOffset = 0;
    let reconTotal = 0;
    let reconData = [];

    // ---- DOM 引用 ----
    const $ = (sel) => document.querySelector(sel);
    const loginScreen = $('#loginScreen');
    const mainApp = $('#mainApp');
    const tokenInput = $('#tokenInput');
    const loginError = $('#loginError');
    const errorBox = $('#errorBox');
    const customerInfo = $('#customerInfo');
    const tokenDisplay = $('#tokenDisplay');

    // ---- 工具函数 ----
    function showError(msg) {
      if (msg) {
        errorBox.textContent = '';
        const div = document.createElement('div');
        div.className = 'error';
        div.textContent = msg;
        errorBox.appendChild(div);
      } else {
        errorBox.textContent = '';
      }
    }

    function showLoginError(msg) {
      if (msg) {
        loginError.style.display = 'block';
        loginError.textContent = msg;
      } else {
        loginError.style.display = 'none';
        loginError.textContent = '';
      }
    }

    function formatCurrency(val) {
      if (val == null || isNaN(val)) return '-';
      return '\u00a5' + Number(val).toFixed(2);
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---- 登录/退出 ----
    async function login() {
      token = tokenInput.value.trim();
      if (!token) { showLoginError('请输入客户令牌'); return; }
      showLoginError('');

      try {
        const res = await fetch('/api/public/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || '令牌无效或已过期');
        }
        customer = await res.json();
        localStorage.setItem('cg_customer_token', token);

        // 切换到主界面
        loginScreen.style.display = 'none';
        mainApp.style.display = 'block';
        customerInfo.textContent = (customer.displayName || customer.customerKey || '') + ' \u00b7 ' + (customer.baseId || '');
        tokenDisplay.textContent = '已登录';

        loadOrders(0);
      } catch (e) {
        showLoginError(e.message);
        logout();
      }
    }

    function logout() {
      token = '';
      customer = null;
      localStorage.removeItem('cg_customer_token');
      tokenInput.value = '';
      customerInfo.textContent = '';
      tokenDisplay.textContent = '';
      loginScreen.style.display = 'flex';
      mainApp.style.display = 'none';
      showLoginError('');
      showError('');
    }

    // ---- 选项卡切换 ----
    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      const tabEl = document.querySelector('.tab[data-tab="' + tabName + '"]');
      if (tabEl) tabEl.classList.add('active');
      const panelEl = document.getElementById('panel-' + tabName);
      if (panelEl) panelEl.classList.add('active');

      if (tabName === 'orders') loadOrders(0);
      if (tabName === 'bills') loadBills(0);
      if (tabName === 'recon') loadRecon(0);
    }

    // ---- 通用请求头 ----
    function authHeaders() {
      return { 'X-Customer-Token': token };
    }

    // ---- 订单 ----
    async function loadOrders(newOffset) {
      if (!token) return;
      ordersOffset = newOffset;
      const params = new URLSearchParams({ limit, offset: ordersOffset });
      const df = $('#orderDateFrom').value;
      const dt = $('#orderDateTo').value;
      const st = $('#orderStatus').value;
      const kw = $('#orderKeyword').value.trim();
      if (df) params.set('dateFrom', df);
      if (dt) params.set('dateTo', dt);
      if (st) params.set('status', st);
      if (kw) params.set('keyword', kw);

      try {
        const res = await fetch('/api/public/orders?' + params.toString(), { headers: authHeaders() });
        if (!res.ok) throw new Error('查询失败: ' + res.status);
        const data = await res.json();
        ordersTotal = data.total || 0;
        ordersData = data.orders || data.results || [];
        renderOrdersTable();
        renderOrdersStats();
        renderOrdersPagination();
      } catch (e) {
        showError(e.message);
      }
    }

    function renderOrdersTable() {
      const area = $('#ordersTableArea');
      area.textContent = '';
      if (!ordersData.length) {
        const div = document.createElement('div');
        div.className = 'empty';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2');
        svg.innerHTML = '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>';
        div.appendChild(svg);
        div.appendChild(document.createTextNode('暂无订单数据'));
        area.appendChild(div);
        return;
      }

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      ['订单号', '状态', '产品', '金额', '应收', '应付', '创建日期'].forEach(text => {
        const th = document.createElement('th');
        th.textContent = text;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (const row of ordersData) {
        const tr = document.createElement('tr');
        const d = row.data || row;
        const cells = [
          d.orderNo || d.id || '-',
          d.status || d.orderStatus || '-',
          d.productName || d.product || '-',
          formatCurrency(d.amount || d.totalAmount),
          formatCurrency(d.receivable),
          formatCurrency(d.payable),
          d.createdAt || d.createdDate || d.completedDate || '-'
        ];
        cells.forEach((val, idx) => {
          const td = document.createElement('td');
          if (idx === 1) {
            // 状态列用 badge
            const span = document.createElement('span');
            span.className = 'badge ' + getStatusBadgeClass(val);
            span.textContent = val;
            td.appendChild(span);
          } else {
            td.textContent = val;
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      area.appendChild(table);
    }

    function renderOrdersStats() {
      let totalAmount = 0, completedCount = 0, pendingCount = 0;
      for (const row of ordersData) {
        const d = row.data || row;
        totalAmount += Number(d.amount || d.totalAmount || 0);
        const st = d.status || d.orderStatus || '';
        if (st === 'completed' || st === '已完成') completedCount++;
        if (st === 'pending' || st === '待处理') pendingCount++;
      }
      $('#statOrderTotal').textContent = ordersTotal;
      $('#statOrderAmount').textContent = formatCurrency(totalAmount);
      $('#statOrderCompleted').textContent = completedCount;
      $('#statOrderPending').textContent = pendingCount;
    }

    function renderOrdersPagination() {
      const maxPage = Math.ceil(ordersTotal / limit);
      const currentPage = Math.floor(ordersOffset / limit) + 1;
      $('#orderPageInfo').textContent = '第 ' + currentPage + ' / ' + maxPage + ' 页 (共 ' + ordersTotal + ' 条)';
      $('#orderPrevBtn').disabled = ordersOffset <= 0;
      $('#orderNextBtn').disabled = ordersOffset + limit >= ordersTotal;
    }

    // ---- 账单 ----
    async function loadBills(newOffset) {
      if (!token) return;
      billsOffset = newOffset;
      const params = new URLSearchParams({ limit, offset: billsOffset });
      const df = $('#billDateFrom').value;
      const dt = $('#billDateTo').value;
      const st = $('#billStatus').value;
      if (df) params.set('dateFrom', df);
      if (dt) params.set('dateTo', dt);
      if (st) params.set('status', st);

      try {
        const res = await fetch('/api/public/bills?' + params.toString(), { headers: authHeaders() });
        if (!res.ok) throw new Error('查询失败: ' + res.status);
        const data = await res.json();
        billsTotal = data.total || 0;
        billsData = data.bills || data.results || [];
        renderBillsTable();
        renderBillsStats();
        renderBillsPagination();
      } catch (e) {
        showError(e.message);
      }
    }

    function renderBillsTable() {
      const area = $('#billsTableArea');
      area.textContent = '';
      if (!billsData.length) {
        const div = document.createElement('div');
        div.className = 'empty';
        div.appendChild(document.createTextNode('暂无账单数据'));
        area.appendChild(div);
        return;
      }

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      ['账单号', '关联订单', '金额', '状态', '到期日', '付款日期'].forEach(text => {
        const th = document.createElement('th');
        th.textContent = text;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (const row of billsData) {
        const tr = document.createElement('tr');
        const d = row.data || row;
        const cells = [
          d.billNo || d.id || '-',
          d.orderNo || d.orderId || '-',
          formatCurrency(d.amount || d.totalAmount),
          d.status || '-',
          d.dueDate || d.expiryDate || '-',
          d.paidDate || d.paymentDate || '-'
        ];
        cells.forEach((val, idx) => {
          const td = document.createElement('td');
          if (idx === 3) {
            const span = document.createElement('span');
            span.className = 'badge ' + getBillBadgeClass(val);
            span.textContent = val;
            td.appendChild(span);
          } else {
            td.textContent = val;
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      area.appendChild(table);
    }

    function renderBillsStats() {
      let totalAmount = 0, paidAmount = 0, unpaidAmount = 0;
      for (const row of billsData) {
        const d = row.data || row;
        const amt = Number(d.amount || d.totalAmount || 0);
        totalAmount += amt;
        const st = d.status || '';
        if (st === 'paid' || st === '已付款') paidAmount += amt;
        else unpaidAmount += amt;
      }
      $('#statBillTotal').textContent = billsTotal;
      $('#statBillAmount').textContent = formatCurrency(totalAmount);
      $('#statBillPaid').textContent = formatCurrency(paidAmount);
      $('#statBillUnpaid').textContent = formatCurrency(unpaidAmount);
    }

    function renderBillsPagination() {
      const maxPage = Math.ceil(billsTotal / limit);
      const currentPage = Math.floor(billsOffset / limit) + 1;
      $('#billPageInfo').textContent = '第 ' + currentPage + ' / ' + maxPage + ' 页 (共 ' + billsTotal + ' 条)';
      $('#billPrevBtn').disabled = billsOffset <= 0;
      $('#billNextBtn').disabled = billsOffset + limit >= billsTotal;
    }

    // ---- 对账 ----
    async function loadRecon(newOffset) {
      if (!token) return;
      reconOffset = newOffset;
      const params = new URLSearchParams({ limit, offset: reconOffset });
      const df = $('#reconDateFrom').value;
      const dt = $('#reconDateTo').value;
      if (df) params.set('dateFrom', df);
      if (dt) params.set('dateTo', dt);

      try {
        const res = await fetch('/api/public/reconciliation?' + params.toString(), { headers: authHeaders() });
        if (!res.ok) throw new Error('查询失败: ' + res.status);
        const data = await res.json();
        reconTotal = data.total || 0;
        reconData = data.results || data.items || [];

        // 汇总统计
        const summary = data.summary || {};
        $('#rDebit').textContent = formatCurrency(summary.totalDebit || 0);
        $('#rCredit').textContent = formatCurrency(summary.totalCredit || 0);
        $('#rNet').textContent = formatCurrency(summary.netBalance || 0);

        renderReconTable();
        renderReconPagination();
      } catch (e) {
        showError(e.message);
      }
    }

    function renderReconTable() {
      const area = $('#reconTableArea');
      area.textContent = '';
      if (!reconData.length) {
        const div = document.createElement('div');
        div.className = 'empty';
        div.appendChild(document.createTextNode('暂无对账数据'));
        area.appendChild(div);
        return;
      }

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      ['日期', '类型', '描述', '借方', '贷方', '余额', '状态'].forEach(text => {
        const th = document.createElement('th');
        th.textContent = text;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (const row of reconData) {
        const tr = document.createElement('tr');
        const cells = [
          row.recordDate || row.date || '-',
          row.category || row.type || '-',
          row.description || '-',
          row.debit > 0 ? formatCurrency(row.debit) : '-',
          row.credit > 0 ? formatCurrency(row.credit) : '-',
          formatCurrency(row.balance || 0),
          row.status || '-'
        ];
        cells.forEach((val, idx) => {
          const td = document.createElement('td');
          if (idx === 6) {
            const span = document.createElement('span');
            span.className = 'badge ' + getReconBadgeClass(val);
            span.textContent = val;
            td.appendChild(span);
          } else {
            td.textContent = val;
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      area.appendChild(table);
    }

    function renderReconPagination() {
      const maxPage = Math.ceil(reconTotal / limit);
      const currentPage = Math.floor(reconOffset / limit) + 1;
      $('#reconPageInfo').textContent = '第 ' + currentPage + ' / ' + maxPage + ' 页 (共 ' + reconTotal + ' 条)';
      $('#reconPrevBtn').disabled = reconOffset <= 0;
      $('#reconNextBtn').disabled = reconOffset + limit >= reconTotal;
    }

    // ---- Badge 样式辅助 ----
    function getStatusBadgeClass(status) {
      if (status === 'completed' || status === '已完成') return 'badge-success';
      if (status === 'pending' || status === '待处理' || status === '草稿') return 'badge-warn';
      return 'badge-info';
    }

    function getBillBadgeClass(status) {
      if (status === 'paid' || status === '已付款') return 'badge-success';
      if (status === 'overdue' || status === '逾期') return 'badge-warn';
      return 'badge-info';
    }

    function getReconBadgeClass(status) {
      if (status === 'settled') return 'badge-success';
      if (status === 'overdue') return 'badge-warn';
      return 'badge-info';
    }

    // ---- 事件绑定 ----
    $('#loginBtn').addEventListener('click', login);
    tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    $('#logoutBtn').addEventListener('click', logout);

    // 选项卡
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    // 订单筛选
    $('#orderFilterBtn').addEventListener('click', () => loadOrders(0));
    $('#orderResetBtn').addEventListener('click', () => {
      $('#orderDateFrom').value = '';
      $('#orderDateTo').value = '';
      $('#orderStatus').value = '';
      $('#orderKeyword').value = '';
      loadOrders(0);
    });
    $('#orderPrevBtn').addEventListener('click', () => { if (ordersOffset >= limit) loadOrders(ordersOffset - limit); });
    $('#orderNextBtn').addEventListener('click', () => { if (ordersOffset + limit < ordersTotal) loadOrders(ordersOffset + limit); });

    // 账单筛选
    $('#billFilterBtn').addEventListener('click', () => loadBills(0));
    $('#billResetBtn').addEventListener('click', () => {
      $('#billDateFrom').value = '';
      $('#billDateTo').value = '';
      $('#billStatus').value = '';
      loadBills(0);
    });
    $('#billPrevBtn').addEventListener('click', () => { if (billsOffset >= limit) loadBills(billsOffset - limit); });
    $('#billNextBtn').addEventListener('click', () => { if (billsOffset + limit < billsTotal) loadBills(billsOffset + limit); });

    // 对账筛选
    $('#reconFilterBtn').addEventListener('click', () => loadRecon(0));
    $('#reconResetBtn').addEventListener('click', () => {
      $('#reconDateFrom').value = '';
      $('#reconDateTo').value = '';
      loadRecon(0);
    });
    $('#reconPrevBtn').addEventListener('click', () => { if (reconOffset >= limit) loadRecon(reconOffset - limit); });
    $('#reconNextBtn').addEventListener('click', () => { if (reconOffset + limit < reconTotal) loadRecon(reconOffset + limit); });

    // ---- 自动登录 ----
    if (token) {
      tokenInput.value = token;
      login();
    }
  </script>
</body>
</html>
